{% extends "base.html" %}
{% block title %}{% if object %}Editar{% else %}Adicionar{% endif %} exame{% endblock %}
{% block content %}
<h2>{% if object %}Editar{% else %}Adicionar{% endif %} exame</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar</button>
    <a href="{% url 'exame_list' %}">Cancelar</a>
</form>
{% endblock %}
