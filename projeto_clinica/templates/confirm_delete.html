{% extends "base.html" %}
{% block title %}Remover{% endblock %}
{% block content %}
<h2>Remover "{{ object }}"</h2>
<p>Tens a certeza? Esta ação não pode ser desfeita.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Sim, remover</button>
    <a href="{{ view.success_url }}">Cancelar</a>
</form>
{% endblock %}
